name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo -- --deny
      - run: npm run demo:agents -- --deny
      - run: npm run registry
      - run: printf 'Support Bot\nAnswers tickets\n1,2,3,4\nyes\nyes\nyes\nyes\n500\n50\n\nyes\n' | npm run setup -- --no-ai
      - run: npx tsx src/cli.ts registry --config examples/my-actlatch.yaml
