# Act-Latch agent registry example. Not about email: a customer-support
# helpdesk with two agents. Paths are relative to this file.
#
#   See the registry:   npm run registry
#   Run for one agent:  actlatch start --config examples/agents.yaml --agent support-bot

upstreams:
  helpdesk:
    command: npx
    args: [tsx, helpdesk-server.ts]
    cwd: .
    # Ticket text is written by customers, so treat it as untrusted.
    trust: untrusted

# Every agent that may use the gateway, the tools it can use, and what each
# tool lets it do. First matching line wins. Anything not listed is blocked,
# and an agent that is not listed here gets nothing at all.
agents:
  support-bot:
    description: Answers customer tickets
    # Uncomment to require a secret, so another program cannot pretend to be
    # this agent. The gateway must then be started with ACTLATCH_AGENT_KEY set.
    # key: ${SUPPORT_BOT_KEY}
    tools:
      - tool: helpdesk.list_tickets
        decision: allow
      - tool: helpdesk.get_order
        decision: allow
      - tool: helpdesk.reply_ticket
        decision: allow
      - tool: helpdesk.refund_order
        if: { number: { arg: amount, gt: 500 } }
        decision: deny
        reason: Refunds over $500 are never done by an agent.
      # order.price is the real price, looked up by Act-Latch (see lookups below),
      # not a number the agent or the customer typed. $5 of slack is allowed.
      - tool: helpdesk.refund_order
        if: { number: { arg: amount, gt: { fact: order.price, plus: 5 } } }
        decision: approve
        reason: Refund is more than the order's real price; a human must decide.
      - tool: helpdesk.refund_order
        if: { number: { arg: amount, gt: 50 } }
        decision: approve
        reason: Refunds over $50 need a human.
      - tool: helpdesk.refund_order
        decision: allow
      - tool: helpdesk.ask_agent
        decision: allow
      # delete_customer is not listed, so support-bot can never use it.
    # support-bot may hand work to report-bot without asking. Messages to any
    # other agent need a human's approval.
    talksTo: [report-bot]

  report-bot:
    description: Writes a weekly summary; read-only
    tools:
      - tool: helpdesk.list_tickets
        decision: allow

  admin-bot:
    description: Cleans up closed accounts
    tools:
      - tool: helpdesk.delete_customer
        decision: approve
        reason: Deleting a customer always needs a human.

# What each tool does. Act-Latch guesses this from tool names (read / write /
# update / delete, private data, sends things out); set it here when the guess
# is wrong. `npm run registry` shows the result.
toolInfo:
  helpdesk.list_tickets: { sensitive: true }   # tickets hold customer details

# Before deciding on a refund, Act-Latch itself asks the helpdesk for the real
# order (using the order_id the agent gave) and calls the answer "order".
lookups:
  - tool: helpdesk.refund_order
    call: helpdesk.get_order
    args: { order_id: order_id }
    as: order

# Optional extra rules for everyone. When agents are registered these can only
# make a decision stricter, never looser.
policy:
  rules:
    - tool: helpdesk.reply_ticket
      if: { matches: { arg: message, pattern: "password|card number" } }
      decision: deny
      reason: Never send passwords or card numbers to customers.

approval:
  port: 4848
  timeoutSeconds: 300

audit:
  path: ../actlatch-audit.jsonl
